name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish, but queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          # A project page is served from /<repo>/, so the asset base has to
          # match the repository name whatever it is called.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Add these under Settings -> Secrets and variables -> Actions. They
          # keep the Client IDs out of the source and out of the build log; the
          # values still end up readable in the published bundle, which is
          # expected for a PKCE public client.
          #
          # Only SPOTIFY_CLIENT_ID_1 is needed to deploy. A secret that is not
          # set arrives as an empty string and is simply skipped, so unused slots
          # cost nothing. The names may be plain variables rather than secrets —
          # they are only labels — but secrets keep them together.
          VITE_SPOTIFY_CLIENT_ID_1: ${{ secrets.SPOTIFY_CLIENT_ID_1 }}
          VITE_SPOTIFY_CLIENT_NAME_1: ${{ secrets.SPOTIFY_CLIENT_NAME_1 }}
          VITE_SPOTIFY_CLIENT_ID_2: ${{ secrets.SPOTIFY_CLIENT_ID_2 }}
          VITE_SPOTIFY_CLIENT_NAME_2: ${{ secrets.SPOTIFY_CLIENT_NAME_2 }}
          VITE_SPOTIFY_CLIENT_ID_3: ${{ secrets.SPOTIFY_CLIENT_ID_3 }}
          VITE_SPOTIFY_CLIENT_NAME_3: ${{ secrets.SPOTIFY_CLIENT_NAME_3 }}
          VITE_SPOTIFY_CLIENT_ID_4: ${{ secrets.SPOTIFY_CLIENT_ID_4 }}
          VITE_SPOTIFY_CLIENT_NAME_4: ${{ secrets.SPOTIFY_CLIENT_NAME_4 }}
          VITE_SPOTIFY_CLIENT_ID_5: ${{ secrets.SPOTIFY_CLIENT_ID_5 }}
          VITE_SPOTIFY_CLIENT_NAME_5: ${{ secrets.SPOTIFY_CLIENT_NAME_5 }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
