name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Write, because a push to main that earns a new version gets the version
  # bump, the changelog entry and the tag committed back here before the build.
  contents: write
  pages: write
  id-token: write

# Let a running deployment finish, but queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Versioning reads the commits back to the last tag, so the shallow
          # clone a workflow gets by default is not enough.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Only feat, fix and anything breaking move the version. Without this
      # check a release would be cut for a typo in the README, because the
      # release tool falls back to a patch bump when it finds nothing.
      - id: version
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${last:+$last..HEAD}
          subjects=$(git log --format=%s ${range:-HEAD})
          bodies=$(git log --format=%B ${range:-HEAD})

          if echo "$subjects" | grep -qE '^(feat|fix)(\([^)]*\))?!?:' \
            || echo "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
            || echo "$bodies" | grep -qE '^BREAKING[ -]CHANGE:'; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo 'Nothing since the last tag earns a version; publishing as is.'
          fi

      # Runs before the build, so the version shown in the corner of the
      # published app is the one just tagged rather than the previous one.
      #
      # `[skip ci]` keeps this push from starting a second run: the deployment
      # for these commits is the one already in progress here.
      - if: steps.version.outputs.release == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run release -- --releaseCommitMessageFormat 'chore(release): {{currentTag}} [skip ci]'
          git push --follow-tags origin HEAD:main

      # The application reads VITE_SPOTIFY_CLIENT_ID_1, _2 and so on until a
      # number is missing, with no ceiling — so the workflow cannot name them
      # one by one without putting the ceiling back. It copies across every
      # secret whose name matches that pattern and nothing else: a secret called
      # anything different, including the token this job runs with, is left
      # behind. Values are never printed, only how many were found.
      - name: Collect the Spotify applications
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          node -e '
            const all = JSON.parse(process.env.ALL_SECRETS);
            const wanted = /^VITE_SPOTIFY_CLIENT_(ID|NAME)_[0-9]+$/;
            const names = Object.keys(all).filter((name) => wanted.test(name)).sort();
            const lines = names.map((name) => `${name}=${all[name]}`);
            require("node:fs").writeFileSync(".env", lines.join("\n") + "\n");
            console.log(`Found ${names.length} matching secrets.`);
          '

      - run: npm run build
        env:
          # A project page is served from /<repo>/, so the asset base has to
          # match the repository name whatever it is called.
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
