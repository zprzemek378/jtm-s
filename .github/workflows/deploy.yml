name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Write, because a push to main that earns a new version gets the version
  # bump, the changelog entry and the tag committed back here before the build.
  contents: write
  pages: write
  id-token: write

# Let a running deployment finish, but queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Versioning reads the commits back to the last tag, so the shallow
          # clone a workflow gets by default is not enough.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Only feat, fix and anything breaking move the version. Without this
      # check a release would be cut for a typo in the README, because the
      # release tool falls back to a patch bump when it finds nothing.
      - id: version
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${last:+$last..HEAD}
          subjects=$(git log --format=%s ${range:-HEAD})
          bodies=$(git log --format=%B ${range:-HEAD})

          if echo "$subjects" | grep -qE '^(feat|fix)(\([^)]*\))?!?:' \
            || echo "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
            || echo "$bodies" | grep -qE '^BREAKING[ -]CHANGE:'; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo 'Nothing since the last tag earns a version; publishing as is.'
          fi

      # Runs before the build, so the version shown in the corner of the
      # published app is the one just tagged rather than the previous one.
      #
      # `[skip ci]` keeps this push from starting a second run: the deployment
      # for these commits is the one already in progress here.
      - if: steps.version.outputs.release == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run release -- --releaseCommitMessageFormat 'chore(release): {{currentTag}} [skip ci]'
          git push --follow-tags origin HEAD:main

      - run: npm run build
        env:
          # A project page is served from /<repo>/, so the asset base has to
          # match the repository name whatever it is called.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Add these under Settings -> Secrets and variables -> Actions, as
          # repository secrets, named exactly as below — the same names the
          # variables have, so there is nothing to translate in your head. A
          # secret under the environment rather than the repository is invisible
          # here, because this job declares no environment.
          #
          # They keep the Client IDs out of the source and out of the build log;
          # the values still end up readable in the published bundle, which is
          # expected for a PKCE public client.
          #
          # Only VITE_SPOTIFY_CLIENT_ID_1 is needed to deploy. A secret that is
          # not set arrives as an empty string and is simply skipped, so unused
          # slots cost nothing.
          VITE_SPOTIFY_CLIENT_ID_1: ${{ secrets.VITE_SPOTIFY_CLIENT_ID_1 }}
          VITE_SPOTIFY_CLIENT_NAME_1: ${{ secrets.VITE_SPOTIFY_CLIENT_NAME_1 }}
          VITE_SPOTIFY_CLIENT_ID_2: ${{ secrets.VITE_SPOTIFY_CLIENT_ID_2 }}
          VITE_SPOTIFY_CLIENT_NAME_2: ${{ secrets.VITE_SPOTIFY_CLIENT_NAME_2 }}
          VITE_SPOTIFY_CLIENT_ID_3: ${{ secrets.VITE_SPOTIFY_CLIENT_ID_3 }}
          VITE_SPOTIFY_CLIENT_NAME_3: ${{ secrets.VITE_SPOTIFY_CLIENT_NAME_3 }}
          VITE_SPOTIFY_CLIENT_ID_4: ${{ secrets.VITE_SPOTIFY_CLIENT_ID_4 }}
          VITE_SPOTIFY_CLIENT_NAME_4: ${{ secrets.VITE_SPOTIFY_CLIENT_NAME_4 }}
          VITE_SPOTIFY_CLIENT_ID_5: ${{ secrets.VITE_SPOTIFY_CLIENT_ID_5 }}
          VITE_SPOTIFY_CLIENT_NAME_5: ${{ secrets.VITE_SPOTIFY_CLIENT_NAME_5 }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
