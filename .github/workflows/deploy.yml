name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Write, because a push to main that earns a new version gets the version
  # bump, the changelog entry and the tag committed back here before the build.
  contents: write
  pages: write
  id-token: write

# Let a running deployment finish, but queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Versioning reads the commits back to the last tag, so the shallow
          # clone a workflow gets by default is not enough.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Every push that publishes gets its own version, whatever its commits
      # say: a breaking change moves the first number, a feature the second,
      # anything else the third. The point is not tidy numbering but that every
      # published state can be named — the version in the corner of the app
      # always identifies exactly what is running, and every one of them can be
      # redeployed from its tag if it turns out to be broken.
      #
      # Runs before the build, so the version shown is the one just tagged
      # rather than the previous one. `[skip ci]` keeps this push from starting
      # a second run: the deployment for these commits is already in progress
      # here.
      #
      # Only ever on main. Rolling back means running this workflow from an
      # older tag, and a run started that way must publish that code and nothing
      # else — it must not write a release commit, least of all onto a branch it
      # is not even on.
      # A release needs something to release. Rebuilding main by hand — after a
      # rollback, or simply by mistake — leaves HEAD already sitting on its tag,
      # and cutting a version for it would mint a number for code that already
      # has one, with nothing to put in its changelog.
      - id: pending
        if: github.ref == 'refs/heads/main'
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          count=$(git rev-list --count ${last:+$last..}HEAD)
          echo "count=$count" >> "$GITHUB_OUTPUT"

          if [ "$count" -eq 0 ]; then
            echo "Nothing new since ${last:-the start}; republishing as is."
          fi

      - id: release
        if: github.ref == 'refs/heads/main' && steps.pending.outputs.count != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run release -- --releaseCommitMessageFormat 'chore(release): {{currentTag}} [skip ci]'
          git push --follow-tags origin HEAD:main
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # A tag on its own tells you nothing about what is in it. Publishing the
      # release notes alongside it puts the number, the date and the changes in
      # one place — which is the page you want open when you are deciding which
      # version to go back to, and it sits a click away from the Actions tab you
      # roll back from.
      #
      # The notes are the section the release just wrote at the top of the
      # changelog, taken as far as the next heading.
      - if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          node -e '
            const lines = require("node:fs").readFileSync("CHANGELOG.md", "utf8").split("\n");
            const start = lines.findIndex((line) => line.startsWith("## "));
            const rest = lines.slice(start + 1);
            const end = rest.findIndex((line) => line.startsWith("## "));
            const body = (end === -1 ? rest : rest.slice(0, end)).join("\n").trim();
            require("node:fs").writeFileSync("release-notes.md", body + "\n");
          '
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          rm release-notes.md

      # The application reads VITE_SPOTIFY_CLIENT_ID_1, _2 and so on until a
      # number is missing, with no ceiling — so the workflow cannot name them
      # one by one without putting the ceiling back. It copies across every
      # secret whose name matches that pattern and nothing else: a secret called
      # anything different, including the token this job runs with, is left
      # behind. Values are never printed, only how many were found.
      - name: Collect the Spotify applications
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          node -e '
            const all = JSON.parse(process.env.ALL_SECRETS);
            const wanted = /^VITE_SPOTIFY_CLIENT_(ID|NAME)_[0-9]+$/;
            const names = Object.keys(all).filter((name) => wanted.test(name)).sort();
            const lines = names.map((name) => `${name}=${all[name]}`);
            require("node:fs").writeFileSync(".env", lines.join("\n") + "\n");
            console.log(`Found ${names.length} matching secrets.`);
          '

      - run: npm run build
        env:
          # A project page is served from /<repo>/, so the asset base has to
          # match the repository name whatever it is called.
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
