<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Jaka To Melodia — Spotify" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)" />
    <title>JTM-S</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set the theme before the first render to avoid a flash of light colours.
      // A stored choice wins, otherwise the system decides — the same rule
      // ThemeProvider applies; keep the two in step.
      try {
        var stored = localStorage.getItem("jtm-s.theme");
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
